<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 190' preserveAspectRatio='xMidYMid slice' role='img' aria-label='Restaurant plate with an AI chatbot conversation' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.s{fill:none;stroke:#f26b50;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.f{fill:#f26b50}.w{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.2}.t{fill:#e8ebf2;font:600 11px monospace}.m{fill:#f26b50}.a{animation:hov 3.2s ease-in-out infinite}.d{animation:dash 1s linear infinite;stroke-dasharray:6 8}.k{animation:blk 1.1s steps(1) infinite}.coin{transform-box:fill-box;transform-origin:center;animation:coin 2.6s ease-in-out infinite}@keyframes hov{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes blk{50%{opacity:.15}}@keyframes coin{50%{transform:scaleX(.12)}}</style><rect width='400' height='190' fill='#070a10'/><g class='a'><circle class='s' cx='92' cy='96' r='46'/><circle class='w' cx='92' cy='96' r='30'/><path class='s' d='M30 56v22a6 6 0 0 0 12 0V56M36 56v74M156 56c12 8 14 32 0 46v28'/></g><rect x='206' y='32' width='160' height='34' rx='12' fill='#161c29' stroke='rgba(255,255,255,.2)'/><text x='220' y='53' style='font:600 11px Montserrat,sans-serif;fill:#e8ebf2'>Table for two tonight?</text><rect class='f' x='226' y='80' width='146' height='34' rx='12'/><text x='240' y='101' style='font:700 11px Montserrat,sans-serif;fill:#05070b'>Booked for 8 PM</text><rect x='206' y='128' width='62' height='30' rx='14' fill='#161c29' stroke='rgba(255,255,255,.2)'/><circle class='f k' cx='224' cy='143' r='3'/><circle class='f k' style='animation-delay:.25s' cx='237' cy='143' r='3'/><circle class='f k' style='animation-delay:.5s' cx='250' cy='143' r='3'/></svg>