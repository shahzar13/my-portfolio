<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 190' preserveAspectRatio='xMidYMid slice' role='img' aria-label='Assembly code terminal beside a bank building' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.s{fill:none;stroke:#f26b50;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.f{fill:#f26b50}.w{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.2}.t{fill:#e8ebf2;font:600 11px monospace}.m{fill:#f26b50}.a{animation:hov 3.2s ease-in-out infinite}.d{animation:dash 1s linear infinite;stroke-dasharray:6 8}.k{animation:blk 1.1s steps(1) infinite}.coin{transform-box:fill-box;transform-origin:center;animation:coin 2.6s ease-in-out infinite}@keyframes hov{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes blk{50%{opacity:.15}}@keyframes coin{50%{transform:scaleX(.12)}}</style><rect width='400' height='190' fill='#070a10'/><rect x='28' y='26' width='226' height='140' rx='8' fill='#0b0f17' stroke='rgba(255,255,255,.18)'/><circle class='f' cx='43' cy='40' r='3'/><circle cx='54' cy='40' r='3' fill='#ffffff44'/><circle cx='65' cy='40' r='3' fill='#ffffff44'/><text class='t' x='44' y='72'><tspan class='m'>mov</tspan> ax, balance</text><text class='t' x='44' y='92'><tspan class='m'>add</tspan> ax, deposit</text><text class='t' x='44' y='112'><tspan class='m'>sub</tspan> ax, withdraw</text><text class='t' x='44' y='132'><tspan class='m'>call</tspan> show_balance</text><rect class='f k' x='44' y='142' width='7' height='12'/><g class='a'><path class='s' d='M286 84L340 56l54 28zM296 92v48M318 92v48M340 92v48M362 92v48M384 92v48M284 144h112M278 154h124'/><g class='coin'><circle class='f' cx='340' cy='30' r='11'/><text x='340' y='34' text-anchor='middle' style='font:700 10px Montserrat,sans-serif;fill:#05070b'>Rs</text></g></g></svg>