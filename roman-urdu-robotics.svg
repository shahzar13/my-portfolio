<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 190' preserveAspectRatio='xMidYMid slice' role='img' aria-label='Roman Urdu commands controlling a robot' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.s{fill:none;stroke:#f26b50;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.f{fill:#f26b50}.w{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.2}.t{fill:#e8ebf2;font:600 11px monospace}.m{fill:#f26b50}.a{animation:hov 3.2s ease-in-out infinite}.d{animation:dash 1s linear infinite;stroke-dasharray:6 8}.k{animation:blk 1.1s steps(1) infinite}.coin{transform-box:fill-box;transform-origin:center;animation:coin 2.6s ease-in-out infinite}@keyframes hov{50%{transform:translateY(-6px)}}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes blk{50%{opacity:.15}}@keyframes coin{50%{transform:scaleX(.12)}}</style><rect width='400' height='190' fill='#070a10'/><rect x='34' y='22' width='156' height='146' rx='6' fill='#0b0f17' stroke='rgba(255,255,255,.2)'/><path class='w' d='M50 42h70M50 52h104'/><text class='t' x='50' y='88'><tspan class='m'>“</tspan>aage barho<tspan class='m'>”</tspan></text><text class='t' x='50' y='112'><tspan class='m'>“</tspan>ruk jao<tspan class='m'>”</tspan></text><text class='t' x='50' y='136'><tspan class='m'>“</tspan>daayen mudo<tspan class='m'>”</tspan></text><path class='s d' d='M200 96h42'/><path class='s' d='M238 88l10 8-10 8'/><g class='a'><path class='s' d='M318 52V40'/><circle class='f k' cx='318' cy='35' r='5'/><rect class='s' x='276' y='52' width='84' height='62' rx='14'/><circle class='f' cx='302' cy='80' r='7'/><circle class='f' cx='334' cy='80' r='7'/><path class='s' d='M300 100h36'/><rect class='s' x='284' y='124' width='68' height='38' rx='8'/></g></svg>